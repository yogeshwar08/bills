services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI + Gemini Vision AI)
  # ============================================================================
  - type: web
    name: bill-snap-api
    runtime: python
    plan: free
    region: oregon
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false

  # ============================================================================
  # 2. Frontend Static Site (React 18 + TypeScript + Vite PWA)
  # ============================================================================
  - type: web
    name: bill-snap-frontend
    runtime: static
    plan: free
    region: oregon
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

